name: Bug report
description: Report a reproducible defect
title: "fix: "
body:
  - type: textarea
    id: observed
    attributes:
      label: Problem
      description: What happened and what is the impact?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Use non-sensitive inputs and steps.
      placeholder: |
        1. Run ...
        2. Enter ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Python version, OS, package version
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized logs or evidence
      description: Do not share credentials, private data or unpatched vulnerability details.
