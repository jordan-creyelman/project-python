name: Publish standards release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version from VERSION, without a v prefix"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-standards
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Require main branch
        run: test "$GITHUB_REF" = "refs/heads/main"
      - name: Check out the main commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate version and notes
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          python scripts/check_release.py \
            --version "$REQUESTED_VERSION" \
            --notes-file "$RUNNER_TEMP/standards-notes.md"
      - name: Require successful CI for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          successful_runs=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/docs-check.yml/runs?head_sha=$GITHUB_SHA&status=completed&per_page=20" \
            --jq '[.workflow_runs[] | select(.conclusion == "success")] | length')
          if [ "$successful_runs" -lt 1 ]; then
            echo "No successful docs-check run for $GITHUB_SHA" >&2
            exit 1
          fi
      - name: Reject an existing tag
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$REQUESTED_VERSION" >/dev/null; then
            echo "The version tag already exists." >&2
            exit 1
          fi
      - name: Publish tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          gh release create "v$REQUESTED_VERSION" \
            --target "$GITHUB_SHA" \
            --title "project-python standards v$REQUESTED_VERSION" \
            --notes-file "$RUNNER_TEMP/standards-notes.md"
