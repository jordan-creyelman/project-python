[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "example-app"
version = "0.1.0"
requires-python = ">=3.12"
description = "Modular Python application starter managed with uv"
dependencies = []

[project.scripts]
example-app = "example_app.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/example_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
