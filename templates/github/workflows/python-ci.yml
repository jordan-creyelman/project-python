# TEMPLATE ONLY. Copy to .github/workflows/python-ci.yml in a Python code repo.
# Requires pyproject.toml, a committed uv.lock and pytest/Ruff in the dev group.
# Adjust branches, supported Python versions and optional extras for the project.
name: Python CI (uv)

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install Python
        run: uv python install ${{ matrix.python-version }}
      - name: Install project and development dependencies
        run: uv sync --locked --dev
      - name: Lint
        run: uv run --locked ruff check .
      - name: Check formatting
        run: uv run --locked ruff format --check .
      - name: Run tests
        run: uv run --locked python -m pytest -q
